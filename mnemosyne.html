<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MNEMOSYNE // SHATTER ENGINE</title>
<style>
  /* =========================================================================
     01. DESIGN TOKENS & BASE RESET
     ========================================================================= */
  :root {
    --bg: #050605;
    --panel: rgba(9, 11, 10, 0.94);
    --well: #040504;
    --border-main: #5d786a;
    --border-inner: #27342d;
    --col-div: rgba(93, 120, 106, 0.28);

    --c-green: #4e8f60;
    --c-amber: #a67a3c;
    --c-cyan: #487e9e;
    --c-red: #c45858;
    --c-green-dim: #4e8f60;
    --c-amber-dim: #a67a3c;
    --c-cyan-dim: #487e9e;
    --c-red-dim: #9e4b4b;
    --vellum: #e6e3da;
    --text-main: #c7d1cc;
    --text-dim: #6e8277;
    --mono: 'Courier New', Menlo, Monaco, Consolas, monospace;
  }

  * {
    box-sizing: border-box;
    border-radius: 0;
  }

  html, body, #chassis, .column, .oled-container, .knob-container, #seq-shelf,
  button, .ascii-cell, .lane-tag, .lane-dice, .lane-len-tag, .mosaic-block,
  .ascii-scrub, .cycle-box {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: var(--mono);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: manipulation;
  }

  /* =========================================================================
     02. CHASSIS & UPPER DECK LAYOUT
     ========================================================================= */
  #chassis {
    position: relative;
    display: flex;
    flex-direction: column;
    background-color: var(--panel);
    border: 1px solid var(--border-main);
    outline: 1px solid var(--border-inner);
    outline-offset: -5px;
    padding: 10px 8px 9px 8px;
    box-shadow: inset 0 0 44px rgba(0, 0, 0, 0.94), 0 16px 48px rgba(0, 0, 0, 0.92);
    transform-origin: center center;
    width: 980px;
  }

  #chassis::before,
  #chassis::after {
    position: absolute;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1;
    color: var(--border-main);
    pointer-events: none;
  }
  #chassis::before { content: '◈'; top: 2px; left: 3px; }
  #chassis::after  { content: '◈'; top: 2px; right: 3px; }

  .upper-deck {
    display: grid;
    grid-template-columns: 34px 1fr 34px;
    width: 100%;
    height: 416px;
  }

  .vertical-text {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-align: center;
    font-size: 9.5px;
    font-weight: bold;
    letter-spacing: 3.5px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: center;
    width: 34px;
    height: 416px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .panel-core {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-left: 1px solid var(--col-div);
    border-right: 1px solid var(--col-div);
    padding: 10px 0;
    width: 100%;
    height: 416px;
  }

  .column {
    display: flex;
    flex-direction: column;
    align-items: center;
    border-right: 1px solid var(--col-div);
    padding: 0 10px;
    position: relative;
    min-width: 0;
  }
  .column:last-child {
    border-right: none;
  }

  .col-header {
    width: 100%;
    font-size: 9.5px;
    font-weight: bold;
    letter-spacing: 1.8px;
    margin-bottom: 12px;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--border-inner);
    text-transform: uppercase;
    color: var(--text-dim);
    height: 18px;
    text-align: center;
    transition: color 0.2s ease;
  }
  .col-header::before { content: '· '; color: var(--border-main); }
  .col-header::after  { content: ' ·'; color: var(--border-main); }

  /* =========================================================================
     03. SYSTEM & OLED MODULE
     ========================================================================= */
  .oled-container {
    width: 100%;
    background: var(--well);
    border: 1px solid var(--border-inner);
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 5px;
    gap: 4px;
    box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.85);
  }

  #scope {
    width: 100%;
    height: 36px;
    background: #030403;
    border: 1px solid var(--border-inner);
    cursor: pointer;
    display: block;
    image-rendering: pixelated;
  }

  .oled-row {
    display: flex;
    width: 100%;
    justify-content: space-between;
    gap: 3px;
    align-items: center;
  }

  .oled-btn {
    flex: 1;
    background: #080a09;
    border: 1px solid #35453c;
    color: var(--text-main);
    font-family: var(--mono);
    font-size: 8.5px;
    font-weight: bold;
    letter-spacing: 0.5px;
    padding: 3.5px 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.1s;
    text-align: center;
    white-space: nowrap;
    min-width: 0;
  }
  .oled-btn:hover {
    background: #151c18;
    border-color: var(--border-main);
    color: var(--vellum);
  }
  .oled-btn.active {
    background: var(--vellum);
    color: #050605;
    border-color: var(--vellum);
  }
  .oled-btn.active-red {
    background: var(--c-red);
    color: #050605;
    border-color: var(--c-red);
  }

  .oled-btn.freeze {
    width: 100%;
    background: #080b0a;
    border-color: var(--c-cyan);
    color: var(--c-cyan);
    font-weight: bold;
    font-size: 9.5px;
    padding: 4px 0;
    letter-spacing: 1.4px;
  }
  .oled-btn.freeze:hover {
    background: rgba(72, 126, 158, 0.16);
  }
  .oled-btn.freeze.active {
    background: var(--c-cyan);
    color: #050605;
  }

  /* Custom Hardware A/B Scrubber & Preset Cycle-Box */
  .ab-row {
    display: grid;
    grid-template-columns: 22px 1fr 22px;
    align-items: center;
    width: 100%;
    gap: 3px;
  }
  .ascii-scrub {
    height: 18px;
    background: var(--well);
    border: 1px solid #35453c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: 0.5px;
    color: var(--vellum);
    cursor: ew-resize;
    touch-action: none;
    overflow: hidden;
  }

  .cycle-box {
    display: grid;
    grid-template-columns: 18px 1fr 18px;
    align-items: stretch;
    width: 100%;
    background: var(--well);
    border: 1px solid #35453c;
    height: 20px;
  }
  .cycle-step {
    background: #080a09;
    border: none;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 9px;
    font-weight: bold;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cycle-step:first-child { border-right: 1px solid var(--border-inner); }
  .cycle-step:last-child  { border-left: 1px solid var(--border-inner); }
  .cycle-step:hover {
    background: #151c18;
    color: var(--vellum);
  }
  .cycle-label {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    font-size: 8px;
    font-weight: bold;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    letter-spacing: 0.4px;
  }
  .cycle-label:hover {
    color: var(--vellum);
  }

  /* =========================================================================
     04. MACHINED ROTARY POTENTIOMETERS
     ========================================================================= */
  .knob-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 14px;
    width: 100%;
  }
  .knob-row {
    display: flex;
    justify-content: space-evenly;
    width: 100%;
    margin-bottom: 14px;
  }
  .col-sys .knob-row { margin-bottom: 6px; }
  .col-sys .knob-group { margin-bottom: 2px; }

  .knob-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .knob-label {
    font-size: 8px;
    font-weight: bold;
    margin-bottom: 4px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .knob-svg {
    width: 42px;
    height: 42px;
    cursor: ns-resize;
    overflow: visible;
    filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.75));
    touch-action: none;
  }
  .knob-ticks {
    stroke: #36453d;
    stroke-width: 1.2px;
  }
  .knob-bg {
    fill: #090c0a;
    stroke-width: 1.8px;
  }
  .knob-cap {
    fill: #111513;
    stroke: #28332d;
    stroke-width: 1px;
  }
  .knob-indicator {
    stroke: var(--vellum);
    stroke-width: 2px;
    stroke-linecap: butt;
  }
  .knob-svg.plocked .knob-indicator {
    stroke: var(--c-red);
    stroke-width: 2.5px;
  }
  .knob-svg.mod-active .knob-indicator {
    stroke: var(--c-amber);
  }

  .col-sys .knob-bg { stroke: var(--c-green); }   .col-sys .knob-label { color: var(--c-green); }
  .col-pat .knob-bg { stroke: var(--c-amber); }   .col-pat .knob-label { color: var(--c-amber); }
  .col-tes .knob-bg { stroke: var(--c-cyan); }    .col-tes .knob-label { color: var(--c-cyan); }
  .col-des .knob-bg { stroke: var(--c-red-dim); } .col-des .knob-label { color: var(--c-red-dim); }

  /* =========================================================================
     05. SHATTER MATRIX SEQUENCER & MOSAIC CANOPY
     ========================================================================= */
  #seq-shelf {
    border-top: 1px solid var(--col-div);
    margin: 0;
    padding: 8px 10px 6px 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: rgba(4, 5, 4, 0.85);
    width: 100%;
    position: relative;
    z-index: 2;
  }

  .seq-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    width: 100%;
    white-space: nowrap;
  }

  .seq-section {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .seq-title {
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 1.6px;
    color: var(--vellum);
    margin-right: 4px;
  }

  .seq-btn {
    background: #080a09;
    border: 1px solid #35453c;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 8px;
    font-weight: bold;
    letter-spacing: 0.6px;
    padding: 3px 6px;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.1s;
    white-space: nowrap;
  }
  .seq-btn:hover {
    background: #151c18;
    border-color: var(--border-main);
    color: var(--vellum);
  }
  .seq-btn.active {
    background: var(--vellum);
    color: #050605;
    border-color: var(--vellum);
  }

  .seq-btn.v-sel[data-v="0"].active { background: var(--c-green); border-color: var(--c-green); color: #050605; }
  .seq-btn.v-sel[data-v="1"].active { background: var(--c-amber); border-color: var(--c-amber); color: #050605; }
  .seq-btn.v-sel[data-v="2"].active { background: var(--c-cyan);  border-color: var(--c-cyan);  color: #050605; }
  .seq-btn.v-sel[data-v="3"].active { background: var(--c-red);   border-color: var(--c-red);   color: #050605; }

  #btn-seq-on.active {
    background: var(--c-green);
    border-color: var(--c-green);
    color: #050605;
  }
  #btn-mod-mode.active {
    background: var(--c-red);
    border-color: var(--c-red);
    color: #050605;
  }
  #btn-hold-mode.active {
    background: var(--c-amber);
    border-color: var(--c-amber);
    color: #050605;
  }
  #btn-len {
    cursor: ns-resize;
    touch-action: none;
  }

  /* =========================================================================
     06. 4-LANE MATRIX & 8-BLOCK ASCII MOSAIC BED
     ========================================================================= */
  #altar-matrix-wrap {
    width: 100%;
    background: var(--well);
    border: 1px solid var(--border-inner);
    padding: 5px 8px 4px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.92);
  }

  .ascii-lanes {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 70px;
    border-bottom: 1px solid var(--border-inner);
    padding-bottom: 4px;
    overflow: hidden;
  }

  .ascii-lane-row {
    display: grid;
    grid-template-columns: 44px repeat(16, 1fr) 38px;
    align-items: center;
    height: 15px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0px;
  }
  .ascii-lane-row.selected-lane {
    background: rgba(93, 120, 106, 0.12);
  }

  .lane-left-ctrl {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 3px;
  }

  .lane-tag {
    font-weight: bold;
    cursor: pointer;
    font-size: 9.5px;
    min-width: 18px;
  }

  .lane-dice {
    background: #080a09;
    border: 1px solid #35453c;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 9px;
    line-height: 11px;
    padding: 1px 3px;
    cursor: pointer;
    transition: 0.1s;
  }
  .lane-dice:hover {
    color: var(--vellum);
    border-color: var(--border-main);
    background: #151c18;
  }
  .lane-dice.mod-dice {
    border-color: var(--c-red);
    color: var(--c-red);
  }

  .lane-len-tag {
    font-size: 9px;
    font-weight: bold;
    color: var(--text-dim);
    text-align: right;
    padding-right: 4px;
    cursor: ns-resize;
  }

  .ascii-cell {
    text-align: center;
    cursor: pointer;
    color: #2f3d35;
    font-weight: bold;
    height: 15px;
    line-height: 15px;
    overflow: hidden;
    touch-action: none;
  }
  .ascii-cell:nth-child(4n+2) {
    border-left: 1px solid #1b241f;
  }
  .ascii-cell:hover {
    color: var(--vellum);
    background: rgba(230, 227, 218, 0.06);
  }
  .ascii-cell.out-bounds {
    opacity: 0.18;
  }

  .ascii-cell.trig-on[data-l="0"] { color: var(--c-green); }
  .ascii-cell.trig-on[data-l="1"] { color: var(--c-amber); }
  .ascii-cell.trig-on[data-l="2"] { color: var(--c-cyan); }
  .ascii-cell.trig-on[data-l="3"] { color: var(--c-red-dim); }

  .ascii-cell.trig-on.has-plock[data-l="0"] { color: var(--vellum); }
  .ascii-cell.trig-on.has-plock[data-l="1"] { color: var(--vellum); }
  .ascii-cell.trig-on.has-plock[data-l="2"] { color: var(--vellum); }
  .ascii-cell.trig-on.has-plock[data-l="3"] { color: var(--c-red); }

  .ascii-cell.playhead {
    color: var(--vellum) !important;
    background: rgba(230, 227, 218, 0.14);
  }
  .ascii-cell.mod-editing {
    color: var(--vellum) !important;
    background: rgba(196, 88, 88, 0.34) !important;
  }

  #ascii-bed {
    display: grid;
    grid-template-columns: 44px repeat(8, 1fr) 38px;
    align-items: center;
    height: 74px;
    width: 100%;
    margin: 0;
    padding: 2px 0;
    overflow: hidden;
  }

  .mosaic-block {
    font-family: var(--mono);
    font-size: 9.5px;
    line-height: 10px;
    letter-spacing: 0px;
    white-space: pre;
    margin: 0;
    padding: 0;
    text-align: center;
    color: #4e705e;
    transition: color 0.08s ease;
  }
</style>
</head>
<body>
<div id="chassis">
    <div class="upper-deck">
        <div class="vertical-text">MNEMOSYNE</div>
        <div class="panel-core">

            <!-- COLUMN 1: SYSTEM & OLED -->
            <div class="column col-sys" data-col="sys">
                <div class="col-header" id="hdr-sys">SYSTEM</div>
                <div class="oled-container">
                    <canvas id="scope" title="Toggle Waveform / Seismograph"></canvas>
                    <div class="oled-row">
                        <button class="oled-btn" id="btn-activate">ACTIVATE</button>
                        <button class="oled-btn" id="btn-scatter">SCATTER</button>
                    </div>
                    <div class="oled-row">
                        <button class="oled-btn" id="btn-dump">DUMP</button>
                        <button class="oled-btn" id="btn-rec">REC</button>
                        <button class="oled-btn" id="btn-drift">DRIFT</button>
                    </div>
                    <div class="ab-row">
                        <button class="oled-btn" id="btn-a" title="Capture State A">A</button>
                        <div class="ascii-scrub" id="ab-scrub" title="Drag to Crossfade A / B">[■░░░░░░░]</div>
                        <button class="oled-btn" id="btn-b" title="Capture State B">B</button>
                    </div>
                    <div class="cycle-box" title="Cycle Stored Presets">
                        <button type="button" class="cycle-step" id="btn-preset-prev">&lt;</button>
                        <div class="cycle-label" id="preset-label">INITIALIZED</div>
                        <button type="button" class="cycle-step" id="btn-preset-next">&gt;</button>
                    </div>
                    <div class="oled-row">
                        <button class="oled-btn" id="btn-mic">MIC</button>
                        <button class="oled-btn" id="btn-file">FILE</button>
                        <input type="file" id="file-upload" accept=".wav,.mp3,.m4a,.flac,.ogg,.aiff,.aif,audio/*" style="display:none;">
                    </div>
                    <button class="oled-btn freeze" id="btn-freeze">FREEZE</button>
                </div>

                <div class="knob-row">
                    <div class="knob-container">
                        <div class="knob-label">FAULT</div>
                        <svg class="knob-svg" id="fault" data-val="0" viewBox="0 0 44 44">
                            <g class="knob-ticks">
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-135,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-45,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(0,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(45,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(135,22,22)"/>
                            </g>
                            <circle class="knob-bg" cx="22" cy="22" r="16.5"></circle>
                            <circle class="knob-cap" cx="22" cy="22" r="11.5"></circle>
                            <line class="knob-indicator" x1="22" y1="22" x2="22" y2="7.5"></line>
                        </svg>
                    </div>
                    <div class="knob-container">
                        <div class="knob-label">SEEP</div>
                        <svg class="knob-svg" id="seep" data-val="0" viewBox="0 0 44 44">
                            <g class="knob-ticks">
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-135,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-45,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(0,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(45,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(135,22,22)"/>
                            </g>
                            <circle class="knob-bg" cx="22" cy="22" r="16.5"></circle>
                            <circle class="knob-cap" cx="22" cy="22" r="11.5"></circle>
                            <line class="knob-indicator" x1="22" y1="22" x2="22" y2="7.5"></line>
                        </svg>
                    </div>
                </div>
                <div class="knob-group">
                    <div class="knob-container">
                        <div class="knob-label">ANDAMENTO</div>
                        <svg class="knob-svg" id="andamento" data-val="0.5" viewBox="0 0 44 44">
                            <g class="knob-ticks">
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-135,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-45,22,22)"/>

const words1 = ["EIDOLON", "SILICA", "LETHE", "CANTOR", "STRATUM", "PALE", "DUSK", "MOSAIC"];

const asciiLanesContainer = document.getElementById('ascii-lanes');

const laneRowEls = [];

const laneLenEls = [];
const cellEls = Array.from({ length: 4 }, () => new Array(16));

function initAsciiLanesDOM() {
    asciiLanesContainer.innerHTML = '';
    for (let l = 0; l < 4; l++) {
        const row = document.createElement('div');
        row.className = 'ascii-lane-row';
        laneRowEls.push(row);

        const leftCtrl = document.createElement('div');
        leftCtrl.className = 'lane-left-ctrl';

        const tag = document.createElement('div');
        tag.className = 'lane-tag';
        tag.style.color = laneColors[l];
        tag.textContent = laneLabels[l];
        tag.title = `Select Lane ${laneLabels[l]}`;
        tag.addEventListener('click', () => selectLane(l));

        const diceBtn = document.createElement('button');
        diceBtn.className = 'lane-dice';
        diceBtn.textContent = '⚄';
        diceBtn.addEventListener('click', e => {
            e.stopPropagation();
            rollLaneDice(l);
        });
        laneDiceEls.push(diceBtn);

        leftCtrl.appendChild(tag);
        leftCtrl.appendChild(diceBtn);
        row.appendChild(leftCtrl);

        for (let i = 0; i < 16; i++) {
            const cell = document.createElement('div');
            cell.className = 'ascii-cell';
            cell.dataset.l = l;

            cell.addEventListener('pointerdown', e => {
                const stepIdx = viewPage * 16 + i;
                const stepObj = seqTracks[l][stepIdx];

                if (activeTrack !== l) {
                    activeTrack = l;
                    document.querySelectorAll('.v-sel').forEach(b => b.classList.toggle('active', parseInt(b.dataset.v) === l));
                    updateLenUI();
                }
                if (e.altKey) {
                    laneLengths[l] = stepIdx + 1;
                    if (playSteps[l] >= laneLengths[l]) playSteps[l] = 0;
                    updateLenUI();
                    renderAsciiLanes();
                    return;
                }

                if (!modMode) {
                    isSeqDragging = true;
                    dragStartStep = stepIdx;
                    dragLane = l;
                    dragMoved = false;
                } else {
                    if (editingStep === stepIdx) {
                        stepObj.locks = {};
                        syncKnobsToEditState();
                    } else {
                        if (!stepObj.trig) { stepObj.trig = true; stepObj.level = 1; }
                        editingStep = stepIdx;
                        syncKnobsToEditState();
                    }
                    renderAsciiLanes();
                }
            });

            cell.addEventListener('pointerenter', () => {
                const stepIdx = viewPage * 16 + i;
                if (!isSeqDragging || dragLane !== l || modMode) return;
                if (stepIdx !== dragStartStep) {
                    dragMoved = true;
                    seqTracks[l][dragStartStep].trig = true;
                    seqTracks[l][dragStartStep].level = 2;

                    seqTracks[l][stepIdx].trig = true;
                    seqTracks[l][stepIdx].level = 2;
                    renderAsciiLanes();
                }
            });

            cellEls[l][i] = cell;
            row.appendChild(cell);
        }

        const lenTag = document.createElement('div');
        lenTag.className = 'lane-len-tag';
        lenTag.title = 'Click to select lane';
        lenTag.addEventListener('click', () => selectLane(l));
        laneLenEls.push(lenTag);
        row.appendChild(lenTag);

        asciiLanesContainer.appendChild(row);
    }
}

function updateLenUI() {
    let l = laneLengths[activeTrack];
    lenBtn.textContent = `LEN: ${l}`;
    let maxPages = Math.max(1, Math.ceil(l / 16));
    if (viewPage >= maxPages) viewPage = maxPages - 1;
    pageBtn.textContent = `PG: ${viewPage + 1}/${maxPages}`;
}

function selectLane(v) {
    activeTrack = v;
    document.querySelectorAll('.v-sel').forEach(b => b.classList.toggle('active', parseInt(b.dataset.v) === v));
    if (modMode) {
        const offset = viewPage * 16;
        editingStep = null;
        for (let i = 0; i < 16; i++) {
            if (seqTracks[activeTrack][offset + i].trig) { editingStep = offset + i; break; }
        }
    } else {
        editingStep = null;
    }
    updateLenUI();
    syncKnobsToEditState();
    renderAsciiLanes();
}

function syncKnobsToEditState() {
    document.querySelectorAll('.knob-svg').forEach(k => {
        if (seqUtilKnobs.includes(k.id)) return;
        k.classList.remove('plocked');
        if (modMode && editingStep !== null) {
            const locks = seqTracks[activeTrack][editingStep].locks;
            if (locks[k.id] !== undefined) {
                k.classList.add('plocked');
            }
        }
    });
}

function rollLaneDice(l) {
    selectLane(l);
    const len = laneLengths[l];
    if (!modMode) {
        let s = 0;
        while (s < len) {
            seqTracks[l][s].locks = {};
            const r = Math.random();
            if (r < 0.34) {
                const span = r < 0.14 ? Math.min(4, len - s) : (r < 0.24 ? Math.min(2, len - s) : 1);
                const lvl = r < 0.10 ? 3 : (span > 1 ? 2 : 1);
                for (let k = 0; k < span; k++) {
                    seqTracks[l][s + k].trig = true;
                    seqTracks[l][s + k].level = lvl;
                    seqTracks[l][s + k].locks = {};
                }
                s += span;
            } else {
                seqTracks[l][s].trig = false;
                seqTracks[l][s].level = 0;
                s++;
            }
        }
    } else {
        let hasAny = false;
        for (let s = 0; s < len; s++) if (seqTracks[l][s].trig) hasAny = true;
        if (!hasAny) {
            for (let s = 0; s < len; s++) {
                if (Math.random() < 0.32) {
                    seqTracks[l][s].trig = true;
                    seqTracks[l][s].level = Math.random() < 0.5 ? 2 : 1;
                }
            }
        }
        const pool = laneParamPools[l];
        for (let s = 0; s < len; s++) {
            if (seqTracks[l][s].trig) {
                seqTracks[l][s].locks = {};
                for (let p of pool) {
                    if (Math.random() < 0.65) {
                        let maxCap = (p === 'silica') ? 0.32 : (p === 'cantor' ? 0.28 : 0.88);
                        seqTracks[l][s].locks[p] = Math.max(0.05, Math.min(maxCap, Math.random() * maxCap));
                    }
                }
            }
        }
        syncKnobsToEditState();
    }
    renderAsciiLanes();
}

function evolveLaneOnCycle(l) {
    const grow = baseParams['seq_grow'] || 0;
    if (grow < 0.02) return;
    const len = laneLengths[l];
    const nextState = seqTracks[l].map(st => ({
        trig: st.trig,
        level: st.level,
        locks: { ...st.locks }
    }));

    for (let s = 0; s < len; s++) {
        if (Math.random() > grow * 0.65) continue;

        const cur = seqTracks[l][s];
        const prevIdx = (s - 1 + len) % len;
        const nextIdx = (s + 1) % len;

        if (cur.trig) {
            const action = Math.random();
            if (action < 0.35) {
                let newLvl = cur.level + (Math.random() < 0.55 ? 1 : -1);
                if (newLvl <= 0) {
                    if (grow > 0.45) {
                        nextState[s].trig = false;
                        nextState[s].level = 0;
                    } else {
                        nextState[s].level = 1;
                    }
                } else {
                    nextState[s].level = Math.min(3, newLvl);
                }
            } else if (action < 0.75) {
                const target = Math.random() < 0.5 ? nextIdx : prevIdx;
                if (!nextState[target].trig) {
                    nextState[target].trig = true;
                    nextState[target].level = Math.max(1, cur.level - 1);
                    for (let k in cur.locks) {
                        let drifted = cur.locks[k] + (Math.random() - 0.5) * 0.14 * grow;
                        nextState[target].locks[k] = Math.max(0, Math.min(1, drifted));
                    }
                }
            }
            for (let k in nextState[s].locks) {
                let d = nextState[s].locks[k] + (Math.random() - 0.5) * 0.1 * grow;
                nextState[s].locks[k] = Math.max(0, Math.min(1, d));
            }
        } else if (grow > 0.3 && Math.random() < grow * 0.22) {
            nextState[s].trig = true;
            nextState[s].level = Math.random() < grow ? 2 : 1;
            if (grow > 0.6 && Math.random() < 0.5) {
                const pool = laneParamPools[l];
                const p = pool[Math.floor(Math.random() * pool.length)];
                nextState[s].locks[p] = Math.random() * 0.7;
            }
        }
    }

    for (let s = 0; s < len; s++) {
        seqTracks[l][s] = nextState[s];
    }
}

function renderAsciiLanes() {
    const offset = viewPage * 16;

    for (let l = 0; l < 4; l++) {
        laneRowEls[l].classList.toggle('selected-lane', l === activeTrack);
        laneDiceEls[l].classList.toggle('mod-dice', modMode);
        laneDiceEls[l].title = modMode
            ? `Roll random MOD parameter locks for Lane ${laneLabels[l]}`
            : `Roll random step phrases for Lane ${laneLabels[l]}`;

        const activeLen = laneLengths[l];
        laneLenEls[l].textContent = `/${ String(activeLen).padStart(2, '0') }`;

        for (let i = 0; i < 16; i++) {
            const stepIdx = offset + i;
            const stepObj = seqTracks[l][stepIdx];
            const cell = cellEls[l][i];

            const hasLocks = Object.keys(stepObj.locks).length > 0;
            const isPlayhead = isPlaying && seqOn && playSteps[l] === stepIdx;
            const isEditing = modMode && l === activeTrack && editingStep === stepIdx;

            cell.classList.toggle('out-bounds', stepIdx >= activeLen);
            cell.classList.toggle('trig-on', stepObj.trig);
            cell.classList.toggle('has-plock', hasLocks);
            cell.classList.toggle('playhead', isPlayhead);
            cell.classList.toggle('mod-editing', isEditing);

            let sym = ' · ';
            if (isEditing) {
                sym = '[#]';
            } else if (isPlayhead) {
                if (stepObj.trig) {
                    sym = stepObj.level === 3 ? '[#]' : (stepObj.level === 2 ? '[=]' : '[|]');
                } else {
                    sym = ' ┃ ';
                }
            } else if (stepObj.trig) {
                if (stepObj.level === 3) sym = hasLocks ? '‡#‡' : ' # ';
                else if (stepObj.level === 2) sym = hasLocks ? '‡=‡' : ' = ';
                else sym = hasLocks ? ' ‡ ' : ' | ';
            }
            if (cell.textContent !== sym) {
                cell.textContent = sym;
            }
        }
    }
}

window.addEventListener('pointerup', () => {
    if (!isSeqDragging) return;
    const l = dragLane;
    const s = dragStartStep;
    const wasDrag = dragMoved;
    isSeqDragging = false;
    dragMoved = false;

    if (!wasDrag && l !== null && s !== null && !modMode) {
        const st = seqTracks[l][s];
        if (!st.trig) {
            st.trig = true;
            st.level = 1;
            if (mnemoNode) mnemoNode.port.postMessage({ type: 'morph_inject', lane: l, level: 1, stepIdx: s % 16 });
        } else if (st.level === 1) {
            st.level = 2;
            if (mnemoNode) mnemoNode.port.postMessage({ type: 'morph_inject', lane: l, level: 2, stepIdx: s % 16 });
        } else {
            st.trig = false;
            st.level = 0;
            st.locks = {};
            if (mnemoNode) mnemoNode.port.postMessage({ type: 'morph_release', lane: l });
        }
        editingStep = null;
        renderAsciiLanes();
    }
});

initAsciiLanesDOM();
updateLenUI();
renderAsciiLanes();

document.querySelectorAll('.v-sel').forEach(btn => {
    btn.addEventListener('click', e => {
        selectLane(parseInt(e.target.dataset.v));
    });
});

document.getElementById('btn-seq-on').addEventListener('click', e => {
    seqOn = !seqOn;
    e.target.classList.toggle('active', seqOn);
    e.target.textContent = seqOn ? 'SEQ: ON' : 'SEQ: OFF';
    if (!seqOn) {
        if (mnemoNode) mnemoNode.port.postMessage({ type: 'seq_clear_env' });
        for (let pId of allSynthParams) {
            applyTargetParam(pId, baseParams[pId], false);
        }
    }
    renderAsciiLanes();
});

document.getElementById('btn-mod-mode').addEventListener('click', e => {
    modMode = !modMode;
    e.target.classList.toggle('active', modMode);
    if (modMode) {
        const offset = viewPage * 16;
        editingStep = null;
        for (let i = 0; i < 16; i++) {
            if (seqTracks[activeTrack][offset + i].trig) { editingStep = offset + i; break; }
        }
    } else {
        editingStep = null;
    }
    syncKnobsToEditState();
    renderAsciiLanes();
});

document.getElementById('btn-hold-mode').addEventListener('click', e => {
    holdMode = !holdMode;
    e.target.classList.toggle('active', holdMode);
    if (mnemoNode) mnemoNode.port.postMessage({ type: 'set_hold_mode', value: holdMode });
});

let lenDragging = false, lenStartY = 0, lenStartVal = 16, lenMoved = false;
lenBtn.addEventListener('pointerdown', e => {
    lenDragging = true; lenMoved = false; lenStartY = e.clientY; lenStartVal = laneLengths[activeTrack];
    lenBtn.setPointerCapture(e.pointerId); e.preventDefault();
});
window.addEventListener('pointermove', e => {
    if (!lenDragging) return;
    let dy = lenStartY - e.clientY;
    if (Math.abs(dy) > 4) {
        lenMoved = true;
        let newLen = Math.max(1, Math.min(64, Math.round(lenStartVal + dy * 0.25)));
        laneLengths[activeTrack] = newLen;
        if (playSteps[activeTrack] >= newLen) playSteps[activeTrack] = 0;
        updateLenUI();
        renderAsciiLanes();
    }
});
window.addEventListener('pointerup', e => {
    if (!lenDragging) return;
    lenDragging = false;
    try { lenBtn.releasePointerCapture(e.pointerId); } catch(err){}
    if (!lenMoved) {
        let cur = laneLengths[activeTrack];
        laneLengths[activeTrack] = cur < 16 ? 16 : (cur < 32 ? 32 : (cur < 48 ? 48 : (cur < 64 ? 64 : 16)));
        if (playSteps[activeTrack] >= laneLengths[activeTrack]) playSteps[activeTrack] = 0;
        updateLenUI();
        renderAsciiLanes();
    }
});

pageBtn.addEventListener('click', () => {
    let maxPages = Math.max(1, Math.ceil(laneLengths[activeTrack] / 16));
    viewPage = (viewPage + 1) % maxPages;
    updateLenUI();
    renderAsciiLanes();
});

document.getElementById('btn-clr-lane').addEventListener('click', () => {
    for (let s = 0; s < 64; s++) {
        seqTracks[activeTrack][s].locks = {};
        if (!modMode) {
            seqTracks[activeTrack][s].trig = false;
            seqTracks[activeTrack][s].level = 0;
        }
    }
    if (!modMode && mnemoNode) {
        mnemoNode.port.postMessage({ type: 'morph_release', lane: activeTrack });
    }
    editingStep = null;
    syncKnobsToEditState();
    renderAsciiLanes();
});

function applyTargetParam(kId, targetVal, isLocked) {
    liveParams[kId] = targetVal;
    sendParam(kId, targetVal);
    if (!modMode || editingStep === null) {
        const knobEl = document.getElementById(kId);
        if (knobEl) {
            setKnobVisual(knobEl, targetVal);
            knobEl.classList.toggle('mod-active', isLocked);
        }
    }
}

function advanceSequencer() {
    if (!seqOn) return;
    let combinedLocks = {};

    for (let l = 0; l < 4; l++) {
        let nextStep = (playSteps[l] + 1) % laneLengths[l];
        if (nextStep === 0 && playSteps[l] >= 0) {
            evolveLaneOnCycle(l);
        }
        playSteps[l] = nextStep;
        const stepObj = seqTracks[l][playSteps[l]];

        if (stepObj.trig) {
            if (mnemoNode) {
                mnemoNode.port.postMessage({
                    type: 'morph_inject',
                    lane: l,
                    level: stepObj.level || 1,
                    stepIdx: playSteps[l] % 16
                });
            }
            for (let kId in stepObj.locks) {
                combinedLocks[kId] = stepObj.locks[kId];
            }
        } else if (mnemoNode) {
            mnemoNode.port.postMessage({ type: 'morph_release', lane: l });
        }
    }

    for (let kId in combinedLocks) {
        applyTargetParam(kId, combinedLocks[kId], true);
    }

    if (!holdMode) {
        for (let pId of allSynthParams) {
            if (combinedLocks[pId] === undefined) {
                applyTargetParam(pId, baseParams[pId], false);
            }
        }
    }

    renderAsciiLanes();
}

/* ===========================================================================
   07. 8-BLOCK ASCII MOSAIC VISUALISER
   =========================================================================== */
const mosaicBlockEls = Array.from({ length: 8 }, (_, i) => document.getElementById(`mb-${i}`));
const laneRGB = [
    [78, 143, 96],
    [166, 122, 60],
    [72, 126, 158],
    [158, 75, 75]
];
const blockPollutionRGB = Array.from({ length: 8 }, () => [78, 112, 94]);
const blockPollutionEnergy = new Float32Array(8);
let mosaicPhase = 0;

function renderAsciiMosaic() {
    const eros = liveParams['erosion'] || 0;
    const sil = liveParams['silica'] || 0;
    const fault = liveParams['fault'] || 0;

    const chaos = Math.min(1.0, Math.max(0.0, eros * 0.5 + sil * 0.3 + fault * 0.2 + liveShatterAct * 0.6));
    mosaicPhase += 0.16 + chaos * 0.35;

    const offset = viewPage * 16;
    const bw = 11;
    const bh = 7;

    for (let b = 0; b < 8; b++) {
        const bGrid = Array.from({ length: bh }, () => new Array(bw).fill(' '));
        const stepA = offset + b * 2;
        const stepB = offset + b * 2 + 1;

        const laneEnergies = [0, 0, 0, 0];
        let dominantLane = -1;
        let maxLevel = 0;

        for (let sub = 0; sub < 2; sub++) {
            const stIdx = sub === 0 ? stepA : stepB;
            const cx = sub === 0 ? 2 : 8;
            let colLevel = 0;
            let colHasLock = false;
            let colPlayhead = false;

            for (let l = 0; l < 4; l++) {
                const st = seqTracks[l][stIdx];
                const isPH = isPlaying && seqOn && playSteps[l] === stIdx;
                if (isPH) colPlayhead = true;

                if (st && st.trig) {
                    const lvl = st.level || 1;
                    colLevel = Math.max(colLevel, lvl);
                    if (Object.keys(st.locks).length > 0) colHasLock = true;
                    const weight = isPH ? (lvl * 1.35) : (lvl * 0.22);
                    laneEnergies[l] += weight;
                    if (weight > maxLevel) {
                        maxLevel = weight;
                        dominantLane = l;
                    }
                }
            }

            if (colPlayhead) {
                bGrid[0][cx] = '┃';
                bGrid[1][cx] = colLevel > 0 ? '▼' : '╵';
            } else if (colLevel > 0) {
                bGrid[0][cx] = colHasLock ? '‡' : (colLevel >= 2 ? '|' : ':');
                bGrid[1][cx] = colLevel >= 2 ? 'v' : '·';
            }
        }

        const totalEnergy = laneEnergies[0] + laneEnergies[1] + laneEnergies[2] + laneEnergies[3];
        let targetR = 78, targetG = 112, targetB = 94;
        if (totalEnergy > 0.01) {
            targetR = 0; targetG = 0; targetB = 0;
            for (let l = 0; l < 4; l++) {
                const w = laneEnergies[l] / totalEnergy;
                targetR += laneRGB[l][0] * w;
                targetG += laneRGB[l][1] * w;
                targetB += laneRGB[l][2] * w;
            }
            blockPollutionEnergy[b] = Math.min(1.0, blockPollutionEnergy[b] * 0.75 + totalEnergy * 0.28);
        } else {
            blockPollutionEnergy[b] *= 0.88;
        }

        blockPollutionRGB[b][0] += (targetR - blockPollutionRGB[b][0]) * 0.25;
        blockPollutionRGB[b][1] += (targetG - blockPollutionRGB[b][1]) * 0.25;
        blockPollutionRGB[b][2] += (targetB - blockPollutionRGB[b][2]) * 0.25;

        const rCol = Math.round(blockPollutionRGB[b][0]);
        const gCol = Math.round(blockPollutionRGB[b][1]);
        const bCol = Math.round(blockPollutionRGB[b][2]);

        const el = mosaicBlockEls[b];
        el.style.color = `rgb(${rCol}, ${gCol}, ${bCol})`;
        el.style.textShadow = 'none';

        const isMorphing = totalEnergy > 0.35 || chaos > 0.25 || liveHeads[b % 4] > 0.2;

        for (let r = 2; r <= 5; r++) {
            for (let w = 0; w < bw; w++) {
                const isBorderR = (r === 2 || r === 5);
                const isBorderW = (w === 0 || w === bw - 1);

                if (!isMorphing) {
                    if (isBorderR) bGrid[r][w] = isBorderW ? '+' : '-';
                    else bGrid[r][w] = isBorderW ? '|' : (w % 2 === 0 ? '#' : '=');
                } else {
                    if (dominantLane === 0) {
                        const shift = (r % 2 === 0) ? 1 : -1;
                        const sw = (w + shift + bw) % bw;
                        if (isBorderR) bGrid[r][sw] = isBorderW ? '>' : '=';
                        else bGrid[r][sw] = (w % 3 === 0) ? '»' : '#';
                    } else if (dominantLane === 1) {
                        const eroChars = "·:~. ";
                        const idx = Math.abs(Math.floor(Math.sin(mosaicPhase + w * 0.7 + r) * eroChars.length));
                        bGrid[r][w] = isBorderR ? (w % 2 === 0 ? '·' : ':') : eroChars[idx % eroChars.length];
                    } else if (dominantLane === 2) {
                        const silChars = "/\\◊x*+";
                        const idx = Math.abs(Math.floor(Math.cos(mosaicPhase * 1.5 + w + r) * silChars.length));
                        bGrid[r][w] = silChars[idx % silChars.length];
                    } else if (dominantLane === 3) {
                        if (r === 2) bGrid[r][w] = isBorderW ? '┬' : '~';
                        else if (r === 5) bGrid[r][w] = (w % 2 === 0) ? '⋮' : '╷';
                        else bGrid[r][w] = (w % 2 === 0) ? '│' : '⋮';
                        if (w % 3 === 1) bGrid[6][w] = '╷';
                    } else {
                        const shardChars = ".:;~=*+#%@\\/x+";
                        const idx = Math.abs(Math.floor(Math.sin(mosaicPhase * 2 + w + r + b) * shardChars.length));
                        bGrid[r][w] = shardChars[idx % shardChars.length];
                    }
                }
            }
        }

        el.textContent = bGrid.map(row => row.join('')).join('\n');
    }
}

setInterval(renderAsciiMosaic, 60);
renderAsciiMosaic();
