<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KARST // TECTONIC RHYTHM ENGINE</title>
<style>
  /* =========================================================================
     01. DESIGN TOKENS & BASE RESET
     ========================================================================= */
  :root {
    --bg: #050605;
    --panel: rgba(9, 11, 10, 0.94);
    --well: #040504;
    --border-main: #5d786a;
    --border-inner: #27342d;
    --col-div: rgba(93, 120, 106, 0.28);

    --c-green: #4e8f60;
    --c-amber: #a67a3c;
    --c-steel: #8c9690;
    --c-lime: #9ca352;
    --c-cyan: #487e9e;
    --c-red: #c45858;
    --c-red-dim: #9e4b4b;
    --vellum: #e6e3da;
    --text-main: #c7d1cc;
    --text-dim: #6e8277;
    --mono: 'Courier New', Menlo, Monaco, Consolas, monospace;
  }

  * {
    box-sizing: border-box;
    border-radius: 0;
  }

  html, body, #chassis, .column, .oled-container, .knob-container, #seq-shelf,
  button, .step-btn, .mute-btn, #ascii-bed, .ascii-scrub, .cycle-box {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: var(--mono);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: manipulation;
  }

  /* =========================================================================
     02. CHASSIS & UPPER DECK LAYOUT
     ========================================================================= */
  #chassis {
    position: relative;
    display: flex;
    flex-direction: column;
    background-color: var(--panel);
    border: 1px solid var(--border-main);
    outline: 1px solid var(--border-inner);
    outline-offset: -5px;
    padding: 10px 8px 9px 8px;
    box-shadow: inset 0 0 44px rgba(0, 0, 0, 0.94), 0 16px 48px rgba(0, 0, 0, 0.92);
    transform-origin: center center;
    width: 980px;
  }

  #chassis::before,
  #chassis::after {
    position: absolute;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1;
    color: var(--border-main);
    pointer-events: none;
  }
  #chassis::before { content: '◈'; top: 2px; left: 3px; }
  #chassis::after  { content: '◈'; top: 2px; right: 3px; }

  .upper-deck {
    display: grid;
    grid-template-columns: 32px 1fr 32px;
    width: 100%;
  }

  .vertical-text {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-align: center;
    font-size: 9.5px;
    font-weight: bold;
    letter-spacing: 3.5px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .panel-core {
    display: grid;
    grid-template-columns: 168px repeat(4, 1fr) 126px;
    border-left: 1px solid var(--col-div);
    border-right: 1px solid var(--col-div);
    padding: 10px 0;
    width: 100%;
  }

  .column {
    display: flex;
    flex-direction: column;
    align-items: center;
    border-right: 1px solid var(--col-div);
    padding: 0 7px;
    position: relative;
    min-width: 0;
  }
  .column:last-child {
    border-right: none;
  }

  .col-header {
    width: 100%;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 1.4px;
    margin-bottom: 14px;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--border-inner);
    text-transform: uppercase;
    color: var(--text-dim);
    height: 18px;
    text-align: center;
    transition: color 0.08s ease;
    white-space: nowrap;
  }
  .col-header::before { content: '· '; color: var(--border-main); }
  .col-header::after  { content: ' ·'; color: var(--border-main); }

  /* =========================================================================
     03. GLOBAL & OLED MODULE
     ========================================================================= */
  .oled-container {
    width: 100%;
    background: var(--well);
    border: 1px solid var(--border-inner);
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 5px;
    gap: 4px;
    box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.85);
  }

  #scope {
    width: 100%;
    height: 38px;
    background: #030403;
    border: 1px solid var(--border-inner);
    cursor: pointer;
    display: block;
    image-rendering: pixelated;
  }

  .oled-row {
    display: flex;
    width: 100%;
    justify-content: space-between;
    gap: 3px;
    align-items: center;
  }

  .oled-btn {
    flex: 1;
    background: #080a09;
    border: 1px solid #35453c;
    color: var(--text-main);
    font-family: var(--mono);
    font-size: 8px;
    font-weight: bold;
    letter-spacing: 0.4px;
    padding: 3.5px 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.1s;
    text-align: center;
    white-space: nowrap;
    min-width: 0;
  }
  .oled-btn:hover {
    background: #151c18;
    border-color: var(--border-main);
    color: var(--vellum);
  }
  .oled-btn.active {
    background: var(--vellum);
    color: #050605;
    border-color: var(--vellum);
  }
  .oled-btn.active-red {
    background: var(--c-red);
    color: #050605;
    border-color: var(--c-red);
  }

  .ab-row {
    display: grid;
    grid-template-columns: 20px 1fr 20px;
    align-items: center;
    width: 100%;
    gap: 3px;
  }
  .ascii-scrub {
    height: 18px;
    background: var(--well);
    border: 1px solid #35453c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 0.4px;
    color: var(--vellum);
    cursor: ew-resize;
    touch-action: none;
    overflow: hidden;
  }

  .cycle-box {
    display: grid;
    grid-template-columns: 16px 1fr 16px;
    align-items: stretch;
    width: 100%;
    background: var(--well);
    border: 1px solid #35453c;
    height: 20px;
  }
  .cycle-step {
    background: #080a09;
    border: none;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 8.5px;
    font-weight: bold;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cycle-step:first-child { border-right: 1px solid var(--border-inner); }
  .cycle-step:last-child  { border-left: 1px solid var(--border-inner); }
  .cycle-step:hover {
    background: #151c18;
    color: var(--vellum);
  }
  .cycle-label {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
    font-size: 7.5px;
    font-weight: bold;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .cycle-label:hover {
    color: var(--vellum);
  }

  /* =========================================================================
     04. MACHINED ROTARY POTENTIOMETERS & MUTE SWITCHES
     ========================================================================= */
  .knob-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 14px;
    width: 100%;
  }
  .knob-row {
    display: flex;
    justify-content: space-evenly;
    width: 100%;
    margin-bottom: 14px;
  }
  .knob-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .knob-label {
    font-size: 7.8px;
    font-weight: bold;
    margin-bottom: 4px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .knob-svg {
    width: 40px;
    height: 40px;
    cursor: ns-resize;
    overflow: visible;
    filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.75));
    touch-action: none;
  }
  .knob-ticks {
    stroke: #36453d;
    stroke-width: 1.2px;
  }
  .knob-bg {
    fill: #090c0a;
    stroke-width: 1.8px;
  }
  .knob-cap {
    fill: #111513;
    stroke: #28332d;
    stroke-width: 1px;
  }
  .knob-indicator {
    stroke: var(--vellum);
    stroke-width: 2px;
    stroke-linecap: butt;
  }
  .knob-svg.plocked .knob-indicator {
    stroke: var(--c-red);
    stroke-width: 2.5px;
  }
  .knob-svg.mod-active .knob-indicator {
    stroke: var(--c-amber);
  }

  .mute-btn {
    width: 20px;
    height: 20px;
    background: #080a09;
    border: 1px solid #35453c;
    cursor: pointer;
    margin-top: auto;
    margin-bottom: 6px;
    transition: 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--text-dim);
  }
  .mute-btn::after {
    content: '·';
  }
  .mute-btn:hover {
    border-color: var(--border-main);
    color: var(--vellum);
  }
  .mute-btn.active {
    background: var(--vellum);
    border-color: var(--vellum);
    color: #050605;
  }
  .mute-btn.active::after {
    content: '×';
    font-weight: bold;
  }

  .col-c1 .knob-bg { stroke: var(--c-green); }   .col-c1 .knob-label { color: var(--c-green); }
  .col-v1 .knob-bg { stroke: var(--c-amber); }   .col-v1 .knob-label { color: var(--c-amber); }
  .col-v2 .knob-bg { stroke: var(--c-steel); }   .col-v2 .knob-label { color: var(--c-steel); }
  .col-v3 .knob-bg { stroke: var(--c-lime); }    .col-v3 .knob-label { color: var(--c-lime); }
  .col-v4 .knob-bg { stroke: var(--c-cyan); }    .col-v4 .knob-label { color: var(--c-cyan); }
  .col-c6 .knob-bg { stroke: var(--c-red-dim); } .col-c6 .knob-label { color: var(--c-red-dim); }

  /* =========================================================================
     05. LITHIC SEQUENCER SHELF
     ========================================================================= */
  #seq-shelf {
    border-top: 1px solid var(--col-div);
    margin: 0;
    padding: 8px 10px 6px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(4, 5, 4, 0.85);
    width: 100%;
  }

  .seq-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    white-space: nowrap;
  }

  .seq-section {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .seq-title {
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 1.6px;
    color: var(--vellum);
    margin-right: 4px;
  }

  .seq-btn {
    background: #080a09;
    border: 1px solid #35453c;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 8px;
    font-weight: bold;
    letter-spacing: 0.6px;
    padding: 3.5px 7px;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.1s;
  }
  .seq-btn:hover {
    background: #151c18;
    border-color: var(--border-main);
    color: var(--vellum);
  }
  .seq-btn.active {
    background: var(--vellum);
    color: #050605;
    border-color: var(--vellum);
  }

  .seq-btn.v-sel[data-v="0"].active { background: var(--c-amber); border-color: var(--c-amber); color: #050605; }
  .seq-btn.v-sel[data-v="1"].active { background: var(--c-steel); border-color: var(--c-steel); color: #050605; }
  .seq-btn.v-sel[data-v="2"].active { background: var(--c-lime);  border-color: var(--c-lime);  color: #050605; }
  .seq-btn.v-sel[data-v="3"].active { background: var(--c-cyan);  border-color: var(--c-cyan);  color: #050605; }

  #btn-lock-mode.active {
    background: var(--c-red);
    border-color: var(--c-red);
    color: #050605;
  }
  #btn-seq-trig.active {
    background: var(--c-green);
    border-color: var(--c-green);
    color: #050605;
  }

  /* =========================================================================
     06. 16-STEP PARAMETER LOCK GRID & ASCII HORIZON BED
     ========================================================================= */
  .seq-steps {
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    gap: 5px;
    width: 100%;
  }

  .step-btn {
    height: 36px;
    background: var(--well);
    border: 1px solid var(--border-inner);
    position: relative;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 3px 0;
    transition: border-color 0.05s, background 0.05s;
    touch-action: none;
  }
  .step-btn:nth-child(4n+1) {
    border-left: 2px solid var(--border-main);
  }
  .step-btn:hover {
    border-color: var(--border-main);
  }

  .step-num {
    font-size: 8px;
    font-weight: bold;
    color: var(--text-dim);
    letter-spacing: 0.4px;
    line-height: 1;
  }
  .step-led {
    width: 14px;
    height: 3px;
    background: #18221d;
    transition: 0.05s;
  }
  .step-plock-ind {
    width: 5px;
    height: 5px;
    background: transparent;
  }

  .step-btn.trig-on[data-vcolor="0"] .step-led { background: var(--c-amber); }
  .step-btn.trig-on[data-vcolor="1"] .step-led { background: var(--c-steel); }
  .step-btn.trig-on[data-vcolor="2"] .step-led { background: var(--c-lime); }
  .step-btn.trig-on[data-vcolor="3"] .step-led { background: var(--c-cyan); }

  .step-btn.trig-on {
    background: #0d120f;
    border-color: #35453c;
  }
  .step-btn.has-plock .step-plock-ind {
    background: var(--c-red);
  }
  .step-btn.playhead {
    border-color: var(--vellum) !important;
    background: rgba(230, 227, 218, 0.14);
  }
  .step-btn.editing {
    border: 1px solid var(--c-red) !important;
    background: rgba(196, 88, 88, 0.22);
  }
  .step-btn.editing .step-num {
    color: var(--c-red);
  }

  #ascii-bed-wrap {
    width: 100%;
    height: 54px;
    background: var(--well);
    border: 1px solid var(--border-inner);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #ascii-bed {
    font-family: var(--mono);
    font-size: 9px;
    line-height: 9px;
    letter-spacing: 0px;
    white-space: pre;
    margin: 0;
    background-image: linear-gradient(90deg, #4e8f60, #4e8f60);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
</style>
</head>
<body>
<div id="chassis">
    <div class="upper-deck">
        <div class="vertical-text">KARST</div>
        <div class="panel-core">

            <!-- COLUMN 1: GLOBAL & OLED -->
            <div class="column col-c1">
                <div class="col-header">GLOBAL</div>
                <div class="oled-container">
                    <canvas id="scope" title="Cycle Scope / Seismograph / BPM"></canvas>
                    <div class="oled-row">
                        <button class="oled-btn" id="btn-activate">ACTIVATE</button>
                        <button class="oled-btn" id="btn-scatter">SCATTER</button>
                    </div>
                    <div class="oled-row">
                        <button class="oled-btn" id="btn-dump">DUMP</button>
                        <button class="oled-btn" id="btn-rec">REC</button>
                        <button class="oled-btn" id="btn-drift">DRIFT</button>
                    </div>
                    <div class="ab-row">
                        <button class="oled-btn" id="btn-a" title="Capture State A">A</button>
                        <div class="ascii-scrub" id="ab-scrub" title="Drag to Crossfade A / B">[■░░░░░░░]</div>
                        <button class="oled-btn" id="btn-b" title="Capture State B">B</button>
                    </div>
                    <div class="cycle-box" title="Cycle Stored Presets">
                        <button type="button" class="cycle-step" id="btn-preset-prev">&lt;</button>
                        <div class="cycle-label" id="preset-label">INITIALIZED</div>
                        <button type="button" class="cycle-step" id="btn-preset-next">&gt;</button>
                    </div>
                </div>
                <div class="knob-group">
                    <div class="knob-container">
                        <div class="knob-label">SHEAR</div>
                        <svg class="knob-svg" id="shear" data-val="0" viewBox="0 0 44 44">
                            <g class="knob-ticks">
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-135,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-45,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(0,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(45,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(135,22,22)"/>
                            </g>
                            <circle class="knob-bg" cx="22" cy="22" r="16.5"></circle>
                            <circle class="knob-cap" cx="22" cy="22" r="11.5"></circle>
                            <line class="knob-indicator" x1="22" y1="22" x2="22" y2="7.5"></line>
                        </svg>
                    </div>
                </div>
                <div class="knob-group">
                    <div class="knob-container">
                        <div class="knob-label">STRATA</div>
                        <svg class="knob-svg" id="strata" data-val="0.5" viewBox="0 0 44 44">
                            <g class="knob-ticks">
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-135,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-45,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(0,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(45,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(135,22,22)"/>
                            </g>
                            <circle class="knob-bg" cx="22" cy="22" r="16.5"></circle>
                            <circle class="knob-cap" cx="22" cy="22" r="11.5"></circle>
                            <line class="knob-indicator" x1="22" y1="22" x2="22" y2="7.5"></line>
                        </svg>
                    </div>
                </div>
                <div class="knob-group">
                    <div class="knob-container">
                        <div class="knob-label">EROSION</div>
                        <svg class="knob-svg" id="erosion" data-val="0" viewBox="0 0 44 44">
                            <g class="knob-ticks">
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-135,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-45,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(0,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(45,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(135,22,22)"/>
                            </g>
                            <circle class="knob-bg" cx="22" cy="22" r="16.5"></circle>
                            <circle class="knob-cap" cx="22" cy="22" r="11.5"></circle>
                            <line class="knob-indicator" x1="22" y1="22" x2="22" y2="7.5"></line>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- COLUMN 2: I. MANTLE -->
            <div class="column col-v1">
                <div class="col-header" id="hdr-v1">I. MANTLE</div>
                <div class="knob-group">
                    <div class="knob-container">
                        <div class="knob-label">MASS</div>
                        <svg class="knob-svg" id="v1_mass" data-val="0.1" viewBox="0 0 44 44">
                            <g class="knob-ticks">
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-135,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-90,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(-45,22,22)"/>
                                <line x1="22" y1="1.5" x2="22" y2="4.5" transform="rotate(0,22,22)"/>

function fitToScreen() {
    const chassis = document.getElementById('chassis');
    chassis.style.transform = 'none';
    const rect = chassis.getBoundingClientRect();
    const padding = 20;
    const scaleX = window.innerWidth / (rect.width + padding);
    const scaleY = window.innerHeight / (rect.height + padding);
    const scale = Math.min(1, scaleX, scaleY);
    chassis.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitToScreen);
setTimeout(fitToScreen, 50);

class SafeDelay {
    constructor(size) { this.size = size; this.buf = new Float32Array(size); this.writeIdx = 0; }
    write(val) { if(isNaN(val)) val = 0; this.buf[this.writeIdx] = val; this.writeIdx = (this.writeIdx + 1) % this.size; }
    read(sAgo) {
        if(isNaN(sAgo)) sAgo = 0; sAgo = Math.max(0, Math.min(sAgo, this.size - 2));
        let rPos = this.writeIdx - sAgo; while(rPos < 0) rPos += this.size;
        let i1 = Math.floor(rPos); let i2 = (i1 + 1) % this.size; let frac = rPos - i1;
        return this.buf[i1] + frac * (this.buf[i2] - this.buf[i1]);
    }
}

            }
        } else {
            if (!seqTrigMode) {
                for (let pId of voiceParamMap[v]) {
                    applyTargetParam(pId, baseParams[pId], false);
                }
            }
        }
    }

    for (let gId of globalLockableParams) {
        let lockedVal = undefined;
        for (let v = 0; v < 4; v++) {
            const stepObj = seqTracks[v][currentPlayStep];
            if (stepObj.trig && stepObj.locks[gId] !== undefined) {
                lockedVal = stepObj.locks[gId];
            }
        }
        if (lockedVal !== undefined) {
            applyTargetParam(gId, lockedVal, true);
        } else {
            applyTargetParam(gId, baseParams[gId], false);
        }
    }

    const stepButtons = stepsContainer.children;
    const offset = viewPage * 16;
    for (let i = 0; i < 16; i++) {
        if (stepButtons[i]) {
            stepButtons[i].classList.toggle('playhead', (offset + i) === currentPlayStep);
        }
    }
}

/* ===========================================================================
   07. ASCII HORIZON VISUALISER
   =========================================================================== */
const asciiBed = document.getElementById('ascii-bed');
let asciiPhase = 0;

function updateAsciiColorGradient() {
    const bake = baseParams['bake'] || 0;
    const baseCols = [
        [166, 122, 60],
        [140, 150, 144],
        [156, 163, 82],
        [72, 126, 158]
    ];

    const stops = [];
    for (let v = 0; v < 4; v++) {
        const pList = voiceParamMap[v];
        let dialSum = 0;
        for (let p of pList) dialSum += (baseParams[p] || 0);
        let dialNorm = dialSum / pList.length;
        let env = Math.min(1, liveEnvs[v] * 1.3);

        let colorWeight = Math.min(1, dialNorm * 1.15 + env * 0.45);
        let r = 78 * (1 - colorWeight) + baseCols[v][0] * colorWeight;
        let g = 143 * (1 - colorWeight) + baseCols[v][1] * colorWeight;
        let b = 96 * (1 - colorWeight) + baseCols[v][2] * colorWeight;

        if (bake > 0.01) {
            let heat = Math.min(1, bake * 1.1);
            r = r * (1 - heat) + 196 * heat;
            g = g * (1 - heat) + (88 + env * 65) * heat;
            b = b * (1 - heat) + (88 + env * 45) * heat;
        }

        let boost = 0.72 + env * 0.45 + dialNorm * 0.2;
        r = Math.min(230, Math.round(r * boost));
        g = Math.min(227, Math.round(g * boost));
        b = Math.min(218, Math.round(b * boost));

        stops.push(`rgb(${r}, ${g}, ${b})`);
    }

    asciiBed.style.backgroundImage = `linear-gradient(90deg, ${stops[0]} 12%, ${stops[1]} 38%, ${stops[2]} 64%, ${stops[3]} 88%)`;
    asciiBed.style.filter = 'none';
}

function renderAsciiHorizon() {
    let totalTrigs = 0;
    let totalLocks = 0;
    for (let v = 0; v < 4; v++) {
        for (let s = 0; s < seqLength; s++) {
            if (seqTracks[v][s].trig) totalTrigs++;
            totalLocks += Object.keys(seqTracks[v][s].locks).length;
        }
    }

    updateAsciiColorGradient();

    const density = Math.min(1.0, (totalTrigs * 0.4 + totalLocks * 2.2) / 36.0);
    const envEnergy = (liveEnvs[0] + liveEnvs[1] + liveEnvs[2] + liveEnvs[3]) * 0.35;
    asciiPhase += 0.04 + envEnergy * 0.25;

    const cols = 152;
    const rows = 5;
    const boulderChars = " .,:;+*?%S#&80@";
    let out = "";

    for (let r = 0; r < rows; r++) {
        let line = "";
        for (let c = 0; c < cols; c++) {
            let nx = c / cols;
            let ny = r / (rows - 1);

            if (density < 0.15) {
                let hash = Math.sin((c + Math.floor(asciiPhase * 3)) * 12.9898 + r * 78.233) * 43758.5453;
                let rand = hash - Math.floor(hash);
                if (rand > 0.965 - (density * 0.2) - (envEnergy * 0.05)) {
                    line += rand > 0.985 ? "+" : (rand > 0.975 ? ":" : ".");
                } else {
                    line += " ";
                }
            } else {
                let field = 0;
                for (let b = 0; b < 4; b++) {
                    let bx = 0.14 + b * 0.24 + Math.sin(asciiPhase * 0.3 + b * 2.1) * 0.03;
                    let by = 0.65 - (liveEnvs[b] * 0.3);
                    let dx = (nx - bx) * 3.8;
                    let dy = (ny - by) * 1.1;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let crag = Math.sin(c * 0.45 + r * 1.7 + b) * 0.12 + Math.cos(c * 0.18 - asciiPhase * 0.5) * 0.08;
                    let radius = (0.12 + density * 0.38) * (1.0 + liveEnvs[b] * 0.25);
                    let contrib = Math.max(0, 1.0 - (dist + crag) / radius);
                    field = Math.max(field, contrib);
                }

                let grit = (Math.sin(c * 19.1 + r * 31.7 + Math.floor(asciiPhase * 2)) * 43758.5453) % 1;
                if (field > 0.04) {
                    let idx = Math.min(boulderChars.length - 1, Math.floor(field * boulderChars.length));
                    line += boulderChars[idx];
                } else if (Math.abs(grit) > 0.94 - density * 0.06) {
                    line += ".";
                } else {
                    line += " ";
                }
            }
        }
        out += line + (r < rows - 1 ? "\n" : "");
    }
    asciiBed.textContent = out;
}

setInterval(renderAsciiHorizon, 60);
renderAsciiHorizon();
</script>
